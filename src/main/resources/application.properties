# ------------------------------------------------------------------
# PARALLAX - Observatorium fuer dynamische Astrophysik
# Serverkonfiguration der Architecture Ref. Card 01
# ------------------------------------------------------------------

spring.application.name=architecture-refcard-01

# HTTP-Port, per Umgebungsvariable PORT ueberschreibbar (z. B. im Container)
server.port=${PORT:8080}

# Zeichensatz fuer Umlaute und astronomische Symbole
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true

# Antworten komprimieren (eine Lichtkurve umfasst mehrere hundert Messpunkte)
server.compression.enabled=true
server.compression.mime-types=application/json,text/html,text/css,application/javascript
server.compression.min-response-size=1024

# Sauberes Herunterfahren: laufende Anfragen werden beim Stoppen noch beantwortet
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=15s

# Thymeleaf
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.cache=true

# Jackson: Zeitstempel als ISO-8601-Text in UTC, leere Felder weglassen
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null
spring.jackson.time-zone=UTC

# ------------------------------------------------------------------
# Fachliche Parameter der Transit-Photometrie (Kanal /api/lightcurve)
# ------------------------------------------------------------------
# Zeitraffer: 1 Sekunde Echtzeit entspricht 3000 Sekunden Beobachtungszeit
parallax.photometry.time-lapse=3000
# Zeitabstand zwischen zwei Messpunkten (virtuelle Minuten)
parallax.photometry.cadence-minutes=6
# Laenge des gelieferten Beobachtungsfensters (virtuelle Stunden).
# Groesser als die Umlaufperiode (84.6 h), damit immer mindestens ein Transit sichtbar ist.
parallax.photometry.window-hours=90
# Photometrisches Rauschen pro Messpunkt in ppm (parts per million)
parallax.photometry.noise-ppm=1100
